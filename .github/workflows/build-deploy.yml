name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/jamjam-site:latest
            ${{ secrets.DOCKER_USERNAME }}/jamjam-site:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/jamjam-site:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/jamjam-site:buildcache,mode=max
          platforms: linux/amd64

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull the latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/jamjam-site:latest

            # Find and stop the running container
            CONTAINER_ID=$(docker ps -q -f name=jamjam-site)
            if [ ! -z "$CONTAINER_ID" ]; then
              echo "Stopping container: $CONTAINER_ID"
              docker stop $CONTAINER_ID
              docker rm $CONTAINER_ID
            fi

            # Start new container with the updated image
            # Adjust the docker run command below with your actual environment variables and ports
            docker run -d \
              --name jamjam-site \
              --restart unless-stopped \
              -p 3000:3000 \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e PAYLOAD_SECRET="${PAYLOAD_SECRET}" \
              -e NEXT_PUBLIC_SERVER_URL="${NEXT_PUBLIC_SERVER_URL}" \
              ${{ secrets.DOCKER_USERNAME }}/jamjam-site:latest

            # Clean up old images
            docker image prune -f

            echo "Deployment completed successfully!"
