name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/jamjam-site:latest
            ${{ secrets.DOCKER_USERNAME }}/jamjam-site:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/jamjam-site:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/jamjam-site:buildcache,mode=max
          platforms: linux/amd64

      - name: Trigger Dokploy webhook
        run: |
          curl -X GET "http://5.78.131.100:3000/api/deploy/U_PsEAsjRRGvQiS5KHat8"